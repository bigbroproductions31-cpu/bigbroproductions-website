# Static site, no build step. Publish the repo root (where index.html lives).
[build]
  publish = "."

# Security headers for every page and file.
# CSP: only our own scripts run (no inline JS); styles may be inline because the template
# uses style="" attributes everywhere; fonts come from Google Fonts; videos from YouTube.
# Deliberately no upgrade-insecure-requests: when the site is reached over http before https
# works (e.g. while a new domain's certificate is pending) it makes every file fail to load.
# Netlify redirects http to https on its own once the certificate exists.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """\
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
      font-src 'self' data: https://fonts.gstatic.com; \
      img-src 'self' data:; \
      media-src 'self'; \
      frame-src https://www.youtube-nocookie.com https://www.youtube.com; \
      connect-src 'self'; \
      object-src 'none'; \
      base-uri 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'"""
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
